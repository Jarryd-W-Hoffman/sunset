name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    name: Lint & Static Analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Lint
        run: composer lint

      - name: Static analysis
        run: composer analyse

      - name: Static analysis (tests)
        run: composer analyse:tests

  # Route Notes and Ghost Buster are never installed here, so every run proves
  # Sunset works on its own.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.3, 8.4, 8.5]
        laravel: [12.*, 13.*]
        include:
          - laravel: 12.*
            testbench: ^10.0
          - laravel: 13.*
            testbench: ^11.0

    name: P${{ matrix.php }} - L${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Make sure the sibling packages aren't installed
        run: |
          for package in jarryd/route-notes jarryd/ghost-buster; do
            if composer show "$package" >/dev/null 2>&1; then
              echo "::error::$package is installed, but Sunset must be tested without it."
              exit 1
            fi
          done

      - name: Execute tests
        run: vendor/bin/phpunit
